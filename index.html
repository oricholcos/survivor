<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- T4.5 触屏适配：viewport-fit=cover 让页面延伸进刘海区（配合 UI 层 env(safe-area-inset-*)）；
         不加 user-scalable=no（可访问性，保留捏合缩放），双击缩放由按钮/画布的 touch-action 拦截 -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>城墙 survivor</title>
    <style>
      html {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        /* 页面层（T4.4）：深蓝黑底 + 微网格 + 双色霓虹渐晕，与画布几何风融合（静态）。
           画布未铺满处（Scale.FIT 黑边）由该底色透出，画布本身覆盖其上不受影响。 */
        background-color: #05050d;
        background-image:
          radial-gradient(ellipse at 50% 36%, rgba(24, 201, 255, 0.08) 0%, rgba(5, 5, 13, 0) 55%),
          radial-gradient(ellipse at 50% 110%, rgba(255, 47, 176, 0.06) 0%, rgba(5, 5, 13, 0) 60%),
          repeating-linear-gradient(0deg, rgba(24, 201, 255, 0.035) 0px, rgba(24, 201, 255, 0.035) 1px, transparent 1px, transparent 36px),
          repeating-linear-gradient(90deg, rgba(24, 201, 255, 0.035) 0px, rgba(24, 201, 255, 0.035) 1px, transparent 1px, transparent 36px);
        /* 字体栈：system-ui 优先 + 中文回退（win 雅黑 / mac 苹方 / android 思源） */
        font-family: system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
        color: #eaf4ff;
        /* T4.5 触屏适配：页面不出现意外滚动条/橡皮筋/下拉刷新；
           点按高亮交给按钮自身 :active 态（-webkit-tap-highlight-color 可继承） */
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
      }
      /* 画布容器占满视口；Phaser Scale.FIT + CENTER_BOTH 会在容器内等比缩放并居中画布 */
      #game {
        width: 100%;
        height: 100%;
        /* 动态视口（T4.5）：移动端地址栏收展时画布区域跟随，底部不被工具栏压住
           （不支持 dvh 的旧浏览器回落上一行 100%） */
        height: 100dvh;
        /* 触屏（T4.5）：画布/黑边区触摸拖动不滚动页面、不触发双击缩放
           （Phaser 3.90 自身不设 canvas touch-action，这里显式兜底；游戏为自动战斗无指针操作） */
        touch-action: none;
      }
      #game canvas {
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
