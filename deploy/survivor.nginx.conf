# survivor — Phaser 竖屏自动战斗游戏，纯静态托管
# 安装：/etc/nginx/sites-available/survivor -> sites-enabled/survivor
# 访问：http://codelingo:8080/（Tailscale 内网；公网需在阿里云安全组放行 8080）
server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /var/www/survivor;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;

    # 带内容哈希的构建产物：长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # 入口 HTML 不缓存，保证发版即生效
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
